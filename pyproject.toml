[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[project]
name = "artusapi"
version = "3.0.0"
description = "ArtusAPI for controlling ARTUS robots by Sarcomere Dynamics Inc."
readme = "README.md"
license-files = ["LICENSE"]
keywords = ["robotics", "artus", "sarcomere dynamics", "control"]
authors = [
    { name = "Sarcomere Dynamics Inc.", email = "support@sarcomeredynamics.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Embedded Systems :: Controller Area Network (CAN)",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "esptool>=5.4.0",
    "pymodbus>=3.5.0",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
]

[project.urls]
Homepage = "https://sarcomeredynamics.com/home"
Repository = "https://github.com/Sarcomere-Dynamics/Sarcomere_Dynamics_Resources"

[tool.uv.build-backend]
module-root = ""
data = {"artusapi" = ["robot_config.yaml"]}